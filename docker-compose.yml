services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adgate
      POSTGRES_PASSWORD: adgate
      POSTGRES_DB: adgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adgate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
