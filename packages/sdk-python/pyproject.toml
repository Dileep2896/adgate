[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adgate"
version = "0.1.0"
description = "adgate client for Python: evaluate a turn, attest the model output hash, track events. Never raises."
readme = "README.md"
# FSL-1.1-Apache-2.0 is not an SPDX identifier, so the licence is declared by file rather than by
# expression. LICENSE.md is a copy of the repository root LICENSE.md (tests/test_license.py keeps
# the two byte identical) and ships in both the sdist and the wheel's .dist-info.
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
keywords = ["ads", "advertising", "llm", "policy", "audit", "adgate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
# datamodel-code-generator is pinned exactly: its output is checked in as src/adgate/models.py
# and tests/test_models_generated.py compares byte for byte, so a different generator version
# would fail CI on an untouched tree. Bump it and regenerate in the same commit.
dev = [
  "datamodel-code-generator==0.76.1",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Dileep2896/adgate"
Source = "https://github.com/Dileep2896/adgate/tree/main/packages/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/adgate"]

[tool.hatch.build.targets.sdist]
include = ["src/adgate", "tests", "scripts", "README.md", "LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated: its shape is the generator's business, and reformatting it would break the
# byte-equality staleness check.
extend-exclude = ["src/adgate/models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401"] # Any is the honest type for a JSON body

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["T201"] # a generator script reports what it wrote

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]
exclude = "src/adgate/models\\.py"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Generated: its types are used everywhere, its style is the generator's business
# (defaults written as the raw JSON value the schema declares, which pydantic coerces).
module = "adgate.models"
follow_imports = "silent"

[[tool.mypy.overrides]]
# Tests are read by people, and pytest fixtures carry their types in the fixture itself.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
