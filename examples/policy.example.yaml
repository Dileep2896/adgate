version: 1
app_id: example-chat
serve_to_tiers: [free]
blocked_categories:
  [health, finance, politics, legal, adult, gambling, weapons, religion, self_harm]
sensitive_detection: strict
min_commercial_intent: 0.6
min_confidence: 0.7
competitor_exclusions: []
frequency_caps:
  per_session: 1
  per_user_per_day: 3
  min_turns_between: 4
disclosure:
  label: 'Sponsored'
  position: after_answer
  style: separate_block
demand:
  - source: direct
  - source: affiliate
    network: partnerstack
    enabled: true
privacy:
  store_raw_text: false
  retain_days: 90
regions:
  allow: [US, CA, GB, EU]
